server {
  listen 80;

  location /api/ {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Lets express-session decide whether a Secure cookie is emissible when TLS
    # terminates in front of this proxy rather than at the app.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints these filenames, so a changed build always has a new URL and
  # the old one can be cached forever.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    root /usr/share/nginx/html;
    # index.html is the one file whose URL never changes, so it must never be cached:
    # a stale copy points the browser at a bundle that no longer exists, and the app
    # silently keeps rendering the previous release after a deploy.
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }
}
